<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Question Bank | Mission Lakshya NEET 2027</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    .qb-page {
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }

    .qb-header {
      margin-bottom: 25px;
    }

    .back-btn {
      display: inline-block;
      padding: 10px 16px;
      margin-bottom: 18px;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      background: rgba(255,255,255,.08);
    }

    .qb-header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .qb-header p {
      margin: 0;
      opacity: .7;
    }

    .subject-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    .subject-btn {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      color: inherit;
      padding: 11px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .subject-btn.active {
      background: #5e0ed7;
      color: white;
    }

    .question-card {
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 20px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
    }

    .question-number {
      font-size: 13px;
      opacity: .6;
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      width: 100%;
      text-align: left;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: inherit;
      cursor: pointer;
      transition: .2s;
    }

    .option:hover {
      border-color: #5e0ed7;
    }

    .option.correct {
      border-color: #21c47b;
      background: rgba(33,196,123,.15);
    }

    .option.wrong {
      border-color: #ff4d6d;
      background: rgba(255,77,109,.15);
    }

    .explanation {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: rgba(94,14,215,.12);
      line-height: 1.6;
    }

    .question-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
    }

    .difficulty {
      font-size: 12px;
      opacity: .7;
    }

    .bookmark-btn {
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 20px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      opacity: .7;
    }

    @media (max-width: 600px) {
      .qb-page {
        padding: 16px;
      }

      .qb-header h1 {
        font-size: 26px;
      }

      .question-text {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<main class="qb-page">

  <a href="../index.html" class="back-btn">← Home</a>

  <header class="qb-header">
    <h1>🧠 Question Bank</h1>
    <p>NEET Physics, Chemistry और Biology के MCQ questions practice करें।</p>
  </header>

  <div class="subject-buttons">
    <button class="subject-btn active" data-subject="all">📚 All</button>
    <button class="subject-btn" data-subject="physics">⚡ Physics</button>
    <button class="subject-btn" data-subject="chemistry">🧪 Chemistry</button>
    <button class="subject-btn" data-subject="biology">🧬 Biology</button>
  </div>

  <section id="questionList"></section>

</main>

<script src="../script.js"></script>

<script>
const questions = [
  {
    subject: "physics",
    question: "बल (Force) की SI इकाई क्या है?",
    options: [
      "Joule",
      "Newton",
      "Watt",
      "Pascal"
    ],
    answer: 1,
    difficulty: "Easy",
    explanation: "बल की SI इकाई Newton (N) है।"
  },

  {
    subject: "physics",
    question: "वेग (Velocity) किस प्रकार की राशि है?",
    options: [
      "अदिश",
      "सदिश",
      "केवल संख्या",
      "इनमें से कोई नहीं"
    ],
    answer: 1,
    difficulty: "Easy",
    explanation: "वेग में परिमाण के साथ दिशा भी होती है, इसलिए यह सदिश राशि है।"
  },

  {
    subject: "chemistry",
    question: "जल का रासायनिक सूत्र क्या है?",
    options: [
      "CO₂",
      "O₂",
      "H₂O",
      "H₂"
    ],
    answer: 2,
    difficulty: "Easy",
    explanation: "जल दो हाइड्रोजन और एक ऑक्सीजन परमाणु से बना होता है, इसलिए इसका सूत्र H₂O है।"
  },

  {
    subject: "chemistry",
    question: "परमाणु क्रमांक किसके बराबर होता है?",
    options: [
      "न्यूट्रॉन की संख्या",
      "प्रोटॉन की संख्या",
      "प्रोटॉन + न्यूट्रॉन",
      "इलेक्ट्रॉन + न्यूट्रॉन"
    ],
    answer: 1,
    difficulty: "Easy",
    explanation: "परमाणु क्रमांक nucleus में उपस्थित प्रोटॉनों की संख्या के बराबर होता है।"
  },

  {
    subject: "biology",
    question: "पौधों में प्रकाश संश्लेषण मुख्यतः किस अंगक में होता है?",
    options: [
      "माइटोकॉन्ड्रिया",
      "राइबोसोम",
      "क्लोरोप्लास्ट",
      "न्यूक्लियस"
    ],
    answer: 2,
    difficulty: "Easy",
    explanation: "प्रकाश संश्लेषण मुख्यतः chloroplast में होता है।"
  },

  {
    subject: "biology",
    question: "मानव शरीर में रक्त का लाल रंग किसके कारण होता है?",
    options: [
      "क्लोरोफिल",
      "हीमोग्लोबिन",
      "इंसुलिन",
      "प्लाज्मा"
    ],
    answer: 1,
    difficulty: "Easy",
    explanation: "हीमोग्लोबिन में उपस्थित heme समूह के कारण रक्त लाल दिखाई देता है।"
  }
];

const list = document.getElementById("questionList");
const subjectButtons = document.querySelectorAll(".subject-btn");

let currentSubject = "all";

function renderQuestions() {

  list.innerHTML = "";

  const filtered = currentSubject === "all"
    ? questions
    : questions.filter(q => q.subject === currentSubject);

  if (!filtered.length) {
    list.innerHTML = `
      <div class="empty">
        <h3>अभी कोई question नहीं मिला।</h3>
      </div>
    `;
    return;
  }

  filtered.forEach((q, index) => {

    const card = document.createElement("article");
    card.className = "question-card";

    card.innerHTML = `
      <div class="question-number">
        Question ${index + 1} • ${q.subject.toUpperCase()}
      </div>

      <div class="question-text">
        ${q.question}
      </div>

      <div class="options">
        ${q.options.map((option, optionIndex) => `
          <button
            class="option"
            data-option="${optionIndex}">
            ${String.fromCharCode(65 + optionIndex)}. ${option}
          </button>
        `).join("")}
      </div>

      <div class="explanation">
        <strong>💡 Explanation:</strong><br>
        ${q.explanation}
      </div>

      <div class="question-actions">
        <span class="difficulty">
          Difficulty: ${q.difficulty}
        </span>

        <button class="bookmark-btn" title="Bookmark">
          🔖
        </button>
      </div>
    `;

    const options = card.querySelectorAll(".option");
    const explanation = card.querySelector(".explanation");

    options.forEach((button, optionIndex) => {

      button.addEventListener("click", () => {

        options.forEach(btn => {
          btn.disabled = true;
        });

        if (optionIndex === q.answer) {
          button.classList.add("correct");
        } else {
          button.classList.add("wrong");
          options[q.answer].classList.add("correct");
        }

        explanation.style.display = "block";
      });

    });

    const bookmark = card.querySelector(".bookmark-btn");

    bookmark.addEventListener("click", () => {

      const key = "missionLakshyaBookmarks";

      let saved = JSON.parse(localStorage.getItem(key) || "[]");

      const item = {
        question: q.question,
        subject: q.subject,
        options: q.options,
        answer: q.answer,
        explanation: q.explanation
      };

      const exists = saved.some(
        x => x.question === item.question
      );

      if (exists) {
        saved = saved.filter(
          x => x.question !== item.question
        );

        bookmark.textContent = "🔖";
      } else {
        saved.push(item);
        bookmark.textContent = "⭐";
      }

      localStorage.setItem(key, JSON.stringify(saved));
    });

    list.appendChild(card);
  });
}

subjectButtons.forEach(button => {

  button.addEventListener("click", () => {

    subjectButtons.forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");

    currentSubject = button.dataset.subject;

    renderQuestions();
  });

});

renderQuestions();
</script>

</body>
</html>
